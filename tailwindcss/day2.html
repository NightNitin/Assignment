<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS Day 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <nav class="pt-6 pl-[20vw] pr-[20vw] pb-6 flex flex-row justify-between text-white bg-gray-500">
        <div class="flex flex-row gap-2">
            <img src="./imgs/logo_leet.png" alt="Leet Code Logo" class="h-[4.8vh]">
            <p class="text-2xl">LeetCode</p>
        </div>
        <div class="flex flex-row gap-8 text-white">
            <a href="#"
                class="text-orange-400 pt-1 pb-2 pl-3 pr-3 rounded-3xl hover:bg-yellow-600 hover:text-black">Premium</a>
            <a href="#" class="pt-1 pb-2 pl-3 pr-3 rounded-3xl hover:bg-white hover:text-black">Explore</a>
            <a href="#" class="pt-1 pb-2 pl-3 pr-3 rounded-3xl hover:bg-white hover:text-black">Product</a>
            <a href="#" class="pt-1 pb-2 pl-3 pr-3 rounded-3xl hover:bg-white hover:text-black">Developer</a>
            <a href="#" class="pt-1 pb-2 pl-3 pr-3 rounded-3xl hover:bg-white hover:text-black">Sign In</a>
        </div>
    </nav>
    <main>
        <div class="flex flex-col gap-8 text-center items-center pt-[14vh] bg-[#F7F2EB] pb-[8vh]">
            <h1 class="text-6xl capitalize">A new way to Learn</h1>
            <p class="text-lg/8 text-[grey]">LeetCode is the best platform to help you enhance your skills, expand <br>your knowledge and prepare for technical interviews.</p>
            <button class="text-lg bg-[#06B48B] pt-1 pb-1 pl-3 pr-3 rounded-3xl text-white hover:bg-[#137e6d]">Create Account ></button>
        </div>
        <div>
            <h2>Start Exploring</h2>
        </div>
    </main>
</body>

</html>
